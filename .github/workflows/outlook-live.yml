# Daily job for the experimental live outlook page (docs/outlook-live.html).
#
# Pulls the newest GFS 00 UTC run (NOAA open-data bucket, about 8 MB), shades it with tools/outlook_live.py, and when a new run is found commits only
# docs/outlook-live-data.js and flat/outlook-live-data.js (about 15 KB each; plus the blend files below) straight to main, then starts the two publish workflows by hand.
#
# Why the explicit dispatches: a push made with GITHUB_TOKEN does not start other workflows, so pages.yml and publish-site.yml would never see this
# commit. workflow_dispatch is the exception GitHub allows, hence `actions: write` and the two `gh workflow run` calls.
#
# Six cron slots, not two (changed 2026-10-16): GitHub starts scheduled workflows late under load, and on 2026-10-15 the 06:10 and 08:40 slots started
# at 11:20 and 13:39 UTC (none at all by 09:16 UTC on the 16th), so the map was up to eight hours stale. More slots mean one of them is likelier to start early.
# Extra runs are harmless: they find the run already built and exit, and the concurrency group keeps two from overlapping.
#
# Safe to run several times a day: the script writes nothing when the newest complete run is already in the data file, so a later cron is a retry for a
# late GFS run. Outside October-April it does nothing (the percentages were measured in those months only). A failed pull fails the job (red run, no
# commit); the page itself warns when its run is older than 36 hours.
#
# Second layer (added 2026-10-14 on Jason's "yes"): after the gust shading, tools/outlook_blend_live.py pulls the same run's GFS, ECMWF, AIFS, GEFS, ENS and AIFS ENS
# 10 m wind (about 1.8 GB streamed, about 12 minutes), blends them the way the GFE wind page does and writes docs/outlook-live-blend.js and
# flat/outlook-live-blend.js (about 190 KB each). It waits (exit 0) until every source has its +96 h posted, which for the ECMWF ensembles is usually after the 06:10
# job, so the 08:40 job normally fills it. The page uses the blend only when its run equals the gust run, so cycles never mix.
#
# Jason approved this unattended publish on 2026-10-14 ("build it with A") and the blend layer the same day ("yes"). To pause it: disable this workflow in the Actions tab.

name: Outlook live (daily)

on:
  schedule:
    - cron: '23 5 * * *'
    - cron: '10 6 * * *'
    - cron: '47 7 * * *'
    - cron: '40 8 * * *'
    - cron: '53 9 * * *'
    - cron: '37 11 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if this run is already in the data file'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: outlook-live
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy, requests and libaec
        run: |
          python3 -m pip install numpy==1.26.4 requests
          sudo apt-get update -qq && sudo apt-get install -y -qq libaec0
      - name: Pull the newest GFS run and shade it
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then python3 tools/outlook_live.py --force; else python3 tools/outlook_live.py; fi
      - name: Blend GFS, ECMWF and AIFS 10 m wind for the same run
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then python3 tools/outlook_blend_live.py --force; else python3 tools/outlook_blend_live.py; fi
      - name: Commit to main and start the publish workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "outlook-live-bot"
          git config user.email "outlook-live-bot@users.noreply.github.com"
          git add docs/outlook-live-data.js flat/outlook-live-data.js docs/outlook-live-blend.js flat/outlook-live-blend.js
          if git diff --cached --quiet; then
            echo "No new run; nothing to commit."
            exit 0
          fi
          run=$(grep -o '"run":"[0-9]*"' docs/outlook-live-data.js | grep -o '[0-9]\{10\}')
          git commit -q -m "Outlook live: GFS run ${run} UTC" -m "Written by .github/workflows/outlook-live.yml (tools/outlook_live.py, tools/outlook_blend_live.py)."
          for attempt in 1 2 3 4; do
            if git push -q origin HEAD:main; then pushed=1; break; fi
            echo "Push rejected (main moved); rebasing and retrying."
            git pull -q --rebase origin main
            sleep $((attempt * 5))
          done
          [ "${pushed:-0}" = "1" ] || { echo "::error::Could not push to main."; exit 1; }
          gh workflow run pages.yml --ref main
          gh workflow run publish-site.yml --ref main
          echo "Pushed run ${run} and started pages.yml and publish-site.yml."
